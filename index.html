<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>个人记忆系统 · 交互演示</title>
  <style>
    :root {
      --paper: #eef0ec;
      --surface: #fbfcf9;
      --surface-strong: #f5f6f2;
      --ink: #131917;
      --muted: #66706b;
      --faint: #8d9691;
      --line: #d8ddd6;
      --line-strong: #bdc5bd;
      --accent: #1f5cff;
      --accent-deep: #1444c8;
      --accent-soft: #e8edff;
      --accent-faint: #f3f5ff;
      --warn: #a55d17;
      --warn-soft: #fff2df;
      --danger: #b53b32;
      --danger-soft: #fff0ee;
      --success: #19714f;
      --success-soft: #e8f5ef;
      --radius: 7px;
      --shadow: 0 18px 50px rgba(33, 42, 37, 0.08);
      --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 280px;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100dvh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        linear-gradient(90deg, rgba(19, 25, 23, 0.025) 1px, transparent 1px),
        linear-gradient(rgba(19, 25, 23, 0.025) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(31, 92, 255, 0.22);
      outline-offset: 2px;
    }

    svg {
      width: 1em;
      height: 1em;
      display: block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .app-shell {
      width: min(1600px, calc(100vw - 32px));
      min-height: calc(100dvh - 32px);
      margin: 16px auto;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 249, 0.96);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--ink);
      color: #fff;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.04em;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      right: 4px;
      top: 4px;
      border-radius: 50%;
      background: #7bffbf;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy span {
      display: block;
      margin-bottom: 1px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.11em;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-tag,
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .demo-tag i,
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(25, 113, 79, 0.1);
    }

    .button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--surface);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .button:hover {
      border-color: var(--ink);
      background: #fff;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      border-color: var(--accent-deep);
      background: var(--accent-deep);
    }

    .button.icon-only {
      width: 34px;
      padding: 0;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
      transform: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 326px;
      min-height: calc(100dvh - 100px);
    }

    .rail {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #f6f7f3;
      min-width: 0;
    }

    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 16px 12px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .rail-head strong {
      color: var(--ink);
      font-weight: 600;
    }

    .stepper {
      display: flex;
      flex-direction: column;
      padding: 0 8px;
    }

    .step-button {
      width: 100%;
      min-height: 52px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 12px;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: var(--muted);
      transition: color 160ms ease, background 160ms ease;
    }

    .step-button:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.66);
    }

    .step-button.active {
      color: var(--ink);
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .step-number {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--faint);
    }

    .step-button.active .step-number,
    .step-button.done .step-number {
      color: var(--accent);
    }

    .step-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .step-indicator {
      width: 6px;
      height: 6px;
      justify-self: end;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: transparent;
    }

    .step-button.active .step-indicator {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .step-button.done .step-indicator {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .rail-foot {
      margin-top: auto;
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 10px;
      line-height: 1.55;
    }

    .rail-foot .live-dot {
      margin-top: 4px;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .scenario-bar {
      min-height: 67px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 1px 1px, rgba(19, 25, 23, 0.09) 1px, transparent 0) 0 0 / 15px 15px,
        var(--surface);
    }

    .scenario-copy {
      min-width: 0;
    }

    .scenario-copy span {
      display: block;
      margin-bottom: 3px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.09em;
    }

    .scenario-copy h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
    }

    .scenario-mode {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(251, 252, 249, 0.92);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      white-space: nowrap;
    }

    .stage {
      flex: 1;
      min-height: 560px;
      padding: 24px 24px 20px;
      overflow: hidden;
    }

    .stage-inner {
      max-width: 860px;
      margin: 0 auto;
      animation: stage-in 260ms ease both;
    }

    @keyframes stage-in {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stage-head {
      margin-bottom: 20px;
    }

    .stage-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .stage-head h3 {
      margin: 0 0 7px;
      font-size: clamp(21px, 2vw, 28px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .stage-head p {
      max-width: 68ch;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .stage-split {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      gap: 18px;
    }

    .section-surface {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-label strong {
      color: var(--muted);
      font-weight: 600;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 5px;
      background: var(--ink);
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
    }

    .message-bubble {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 3px 8px 8px 8px;
      background: var(--surface-strong);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.65;
    }

    .message-meta {
      margin-top: 10px;
      padding-left: 40px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
    }

    .signal-grid {
      display: grid;
      gap: 11px;
    }

    .signal-row {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.55;
    }

    .signal-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .signal-row span {
      color: var(--faint);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .chip.accent {
      border-color: #cbd6ff;
      background: var(--accent-soft);
      color: var(--accent-deep);
    }

    .decision-hint {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 10px;
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .decision-hint .live-dot {
      margin-top: 5px;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .gate-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.55fr);
      gap: 18px;
    }

    .gate-flow {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .flow-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      position: relative;
      min-height: 88px;
    }

    .flow-row:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 43px;
      top: 64px;
      width: 1px;
      height: 42px;
      background: var(--line-strong);
    }

    .flow-tag {
      position: relative;
      z-index: 1;
      width: 88px;
      min-height: 48px;
      display: grid;
      place-items: center;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-align: center;
      line-height: 1.35;
    }

    .flow-tag.accent {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .flow-tag.success {
      border-color: #b9ddce;
      background: var(--success-soft);
      color: var(--success);
    }

    .flow-copy {
      min-width: 0;
    }

    .flow-copy strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      line-height: 1.4;
    }

    .flow-copy span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .score-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
    }

    .score-dial {
      --score: 91;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
      margin: 4px auto 16px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, var(--surface-strong) 58%, transparent 59%),
        conic-gradient(var(--accent) calc(var(--score) * 1%), #dce1db 0);
      position: relative;
    }

    .score-dial::after {
      content: "";
      width: 102px;
      height: 102px;
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface-strong);
    }

    .score-value {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .score-value strong {
      display: block;
      font-family: var(--mono);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .score-value span {
      display: block;
      margin-top: 5px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    .metric-list {
      display: grid;
      gap: 9px;
      margin-top: 4px;
    }

    .metric-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .metric-line strong {
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
    }

    .recall-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
      overflow: hidden;
    }

    .summary-cell {
      min-height: 68px;
      padding: 12px 14px;
      background: var(--surface);
    }

    .summary-cell span {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 9px;
    }

    .summary-cell strong {
      display: block;
      font-size: 13px;
      font-weight: 650;
    }

    .memory-stack {
      display: grid;
      gap: 8px;
    }

    .memory-row {
      width: 100%;
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .memory-row:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .memory-row.selected {
      border-color: #bccaff;
      background: var(--accent-faint);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .memory-row.forgotten {
      opacity: 0.58;
      cursor: default;
    }

    .memory-row.suspended {
      opacity: 0.62;
      cursor: default;
    }

    .memory-row.forgotten .memory-text {
      text-decoration: line-through;
    }

    .memory-row.low-score {
      opacity: 0.62;
    }

    .memory-check {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--surface);
      color: transparent;
      font-size: 12px;
    }

    .memory-row.selected .memory-check {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .memory-main {
      min-width: 0;
    }

    .memory-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
    }

    .layer-tag {
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--surface);
      color: var(--muted);
    }

    .memory-text {
      color: var(--ink);
      font-size: 12px;
      line-height: 1.55;
    }

    .memory-score {
      text-align: right;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
    }

    .memory-score strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .blocked-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 11px;
      padding: 10px 12px;
      border: 1px dashed #e2b8b3;
      border-radius: 5px;
      background: var(--danger-soft);
      color: #7e3934;
      font-size: 10px;
      line-height: 1.45;
    }

    .blocked-row strong {
      color: var(--danger);
      font-family: var(--mono);
      font-size: 9px;
      white-space: nowrap;
    }

    .context-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.55fr);
      gap: 18px;
    }

    .context-window {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .context-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.55;
    }

    .context-row:last-child {
      border-bottom: 0;
    }

    .context-key {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
    }

    .context-value {
      min-width: 0;
      color: var(--ink);
    }

    .context-value.muted {
      color: var(--muted);
    }

    .context-memory {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px dashed var(--line);
    }

    .context-memory:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .context-memory:last-child {
      padding-bottom: 0;
    }

    .context-memory b {
      min-width: 24px;
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 650;
    }

    .context-side {
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .token-box {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
    }

    .token-box span {
      display: block;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
    }

    .token-box strong {
      display: block;
      margin: 7px 0 11px;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .token-bar {
      height: 6px;
      display: flex;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .token-bar i {
      display: block;
      height: 100%;
    }

    .token-bar .system-token {
      background: var(--line-strong);
    }

    .token-bar .query-token {
      background: #8da6ff;
    }

    .token-bar .memory-token {
      background: var(--accent);
    }

    .token-legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 9px;
      color: var(--faint);
      font-size: 8px;
    }

    .token-legend span::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .token-legend span:nth-child(2)::before {
      background: #8da6ff;
    }

    .token-legend span:nth-child(3)::before {
      background: var(--accent);
    }

    .rule-note {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .rule-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 11px;
    }

    .chat-stage {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .chat-stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
    }

    .chat-body {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .assistant-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .assistant-avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
    }

    .assistant-content {
      min-width: 0;
      flex: 1;
    }

    .assistant-content > p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.7;
    }

    .schedule {
      display: grid;
      border-top: 1px solid var(--line);
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.55;
    }

    .schedule-row time {
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 650;
    }

    .memory-state-banner {
      margin-bottom: 13px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .memory-state-banner.off {
      border-color: #ead1b1;
      background: var(--warn-soft);
      color: #784611;
    }

    .answer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface-strong);
    }

    .citations {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .memory-ref {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      border: 1px solid #cad4ff;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 8px;
    }

    .memory-ref:hover {
      border-color: var(--accent);
    }

    .impact-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--line);
      overflow: hidden;
    }

    .impact-strip div {
      padding: 10px 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .impact-strip strong {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 11px;
    }

    .followup-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: var(--accent-faint);
    }

    .followup-row .avatar {
      width: 26px;
      height: 26px;
      background: var(--accent);
      font-size: 9px;
    }

    .followup-row p {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
    }

    .extract-list {
      display: grid;
      gap: 8px;
    }

    .extract-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 108px;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
    }

    .extract-row.blocked {
      border-style: dashed;
      border-color: #e5c0bc;
      background: var(--danger-soft);
    }

    .extract-type {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--surface-strong);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
    }

    .extract-row.blocked .extract-type {
      background: #f9ddda;
      color: var(--danger);
    }

    .extract-copy strong {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      line-height: 1.45;
    }

    .extract-copy span {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.45;
    }

    .confidence {
      text-align: right;
    }

    .confidence span {
      display: block;
      margin-bottom: 4px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
    }

    .confidence strong {
      display: block;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 650;
    }

    .confidence-bar {
      height: 3px;
      margin-top: 5px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }

    .confidence-bar i {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .extract-row.blocked .confidence strong {
      color: var(--danger);
    }

    .layer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--line);
      overflow: hidden;
    }

    .layer-cell {
      min-height: 118px;
      padding: 14px;
      background: var(--surface);
    }

    .layer-cell span {
      display: block;
      margin-bottom: 9px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.07em;
    }

    .layer-cell strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .layer-cell p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .lifecycle-list {
      display: grid;
      gap: 9px;
    }

    .lifecycle-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) 92px;
      gap: 12px;
      align-items: center;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      transition: opacity 200ms ease, background 200ms ease;
    }

    .lifecycle-row.forgotten {
      opacity: 0.55;
      background: var(--surface-strong);
    }

    .lifecycle-row.forgotten .memory-text {
      text-decoration: line-through;
    }

    .lifecycle-action {
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 650;
      text-align: right;
    }

    .lifecycle-row.blocked {
      border-style: dashed;
      border-color: #e5c0bc;
      background: var(--danger-soft);
    }

    .lifecycle-row.blocked .lifecycle-action {
      color: var(--danger);
    }

    .control-surface {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
      gap: 18px;
      margin-top: 16px;
    }

    .control-block {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
    }

    .switch-copy strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .switch-copy span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .switch {
      width: 38px;
      height: 22px;
      flex: 0 0 auto;
      padding: 2px;
      border: 0;
      border-radius: 999px;
      background: var(--line-strong);
      cursor: pointer;
      transition: background 160ms ease;
    }

    .switch::after {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
      transition: transform 160ms ease;
    }

    .switch.on {
      background: var(--accent);
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .forget-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .forget-block p {
      margin: 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .text-button {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid #dfb3ae;
      border-radius: 4px;
      background: #fff;
      color: var(--danger);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .text-button:hover {
      background: var(--danger-soft);
    }

    .text-button:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .stage-footer {
      display: grid;
      grid-template-columns: 112px minmax(80px, 1fr) 112px;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .stage-footer .button {
      width: 100%;
    }

    .footer-progress {
      height: 4px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }

    .footer-progress span {
      display: block;
      width: 14.285%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 260ms ease;
    }

    .explain {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #f7f8f4;
    }

    .explain-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 16px 13px;
      border-bottom: 1px solid var(--line);
    }

    .explain-head span {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .explain-head span:last-child {
      color: var(--faint);
      font-weight: 500;
    }

    .explain-content {
      padding: 18px 16px;
      animation: stage-in 220ms ease both;
    }

    .explain-content h4 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .explain-content > p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.72;
    }

    .explain-points {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .explain-points li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.62;
    }

    .explain-points li::before {
      content: "";
      width: 14px;
      height: 1px;
      flex: 0 0 14px;
      margin-top: 8px;
      background: var(--accent);
    }

    .explain-points strong {
      color: var(--ink);
      font-weight: 600;
    }

    .explain-callout {
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #cad4ff;
      border-radius: 5px;
      background: var(--accent-faint);
      color: #35425e;
      font-size: 10px;
      line-height: 1.65;
    }

    .explain-callout span {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .system-status {
      margin-top: auto;
      border-top: 1px solid var(--line);
    }

    .status-head {
      padding: 11px 16px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      border-top: 1px solid rgba(216, 221, 214, 0.72);
      color: var(--muted);
      font-size: 9px;
    }

    .status-row strong {
      color: var(--ink);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
    }

    .status-row strong.on {
      color: var(--success);
    }

    .empty-state {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      max-width: min(440px, calc(100vw - 32px));
      padding: 10px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 32px rgba(19, 25, 23, 0.2);
      font-size: 11px;
      line-height: 1.5;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1220px) {
      .layout {
        grid-template-columns: 218px minmax(0, 1fr);
        grid-template-rows: auto auto;
      }

      .rail {
        grid-row: 1 / span 2;
      }

      .explain {
        grid-column: 2;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .explain-head {
        grid-column: 1 / -1;
      }

      .explain-content {
        padding-bottom: 14px;
      }

      .system-status {
        margin-top: 0;
        border-top: 0;
        border-left: 1px solid var(--line);
      }
    }

    @media (max-width: 900px) {
      .app-shell {
        width: 100%;
        min-height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .layout {
        display: flex;
        flex-direction: column;
      }

      .rail {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .rail-head,
      .rail-foot {
        display: none;
      }

      .stepper {
        flex-direction: row;
        gap: 5px;
        padding: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .stepper::-webkit-scrollbar {
        display: none;
      }

      .step-button {
        width: auto;
        min-width: 132px;
        min-height: 42px;
        flex: 0 0 auto;
        grid-template-columns: 24px minmax(0, 1fr);
        padding: 6px 8px;
      }

      .step-indicator {
        display: none;
      }

      .step-label {
        font-size: 11px;
      }

      .stage {
        min-height: 0;
        padding: 20px 16px;
      }

      .stage-footer {
        padding: 11px 16px;
      }

      .explain {
        display: block;
      }

      .system-status {
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
      }

      .brand-copy h1 {
        font-size: 14px;
      }

      .demo-tag {
        display: none;
      }

      .top-actions {
        gap: 6px;
      }

      .top-actions .button {
        width: 34px;
        padding: 0;
      }

      .top-actions .button .button-label {
        display: none;
      }

      .scenario-bar {
        padding: 11px 16px;
      }

      .scenario-mode {
        display: none;
      }

      .stage-split,
      .gate-layout,
      .context-layout,
      .layer-grid,
      .control-surface {
        grid-template-columns: 1fr;
      }

      .recall-summary,
      .impact-strip {
        grid-template-columns: 1fr;
      }

      .summary-cell {
        min-height: 52px;
      }

      .flow-row {
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 12px;
      }

      .flow-row:not(:last-child)::after {
        left: 38px;
      }

      .flow-tag {
        width: 76px;
        font-size: 8px;
      }

      .memory-row {
        grid-template-columns: 27px minmax(0, 1fr) 48px;
        gap: 8px;
        padding: 10px;
      }

      .memory-text {
        font-size: 11px;
      }

      .context-row {
        grid-template-columns: 76px minmax(0, 1fr);
        padding: 10px 12px;
      }

      .stage-footer {
        grid-template-columns: 92px minmax(40px, 1fr) 92px;
        gap: 8px;
      }

      .button {
        font-size: 11px;
      }

      .schedule-row {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .extract-row {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .confidence {
        grid-column: 2;
        display: grid;
        grid-template-columns: 1fr 44px;
        align-items: center;
        gap: 8px;
        text-align: left;
      }

      .confidence span {
        margin: 0;
      }

      .confidence-bar {
        grid-column: 1 / -1;
        margin-top: 0;
      }

      .lifecycle-row {
        grid-template-columns: 52px minmax(0, 1fr);
      }

      .lifecycle-action {
        grid-column: 2;
        text-align: left;
      }

      .control-block {
        min-width: 0;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        padding: 9px 10px;
        gap: 8px;
      }

      .brand-copy span {
        display: none;
      }

      .brand-copy h1 {
        max-width: 132px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-head h3 {
        font-size: 21px;
      }

      .stage {
        padding: 18px 12px;
      }

      .scenario-bar {
        padding: 10px 12px;
      }

      .stage-footer {
        padding: 10px 12px;
      }

      .stage-footer .button {
        padding: 0 6px;
      }

      .stage-footer .back-label {
        display: none;
      }

      .stage-footer {
        grid-template-columns: 34px minmax(40px, 1fr) 104px;
      }

      .stage-footer .button.back {
        width: 34px;
      }

      .token-legend {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Paper-figure visual system */
    :root {
      --paper: #ffffff;
      --surface: #ffffff;
      --surface-strong: #f2f2f2;
      --ink: #171717;
      --muted: #555b5f;
      --faint: #72787b;
      --line: #d2d2ce;
      --line-strong: #73777a;
      --accent: #a85b00;
      --accent-deep: #713c00;
      --accent-soft: #fff2cc;
      --accent-faint: #fffaf0;
      --warn: #7f4900;
      --warn-soft: #fff2cc;
      --danger: #b42318;
      --danger-soft: #f8cecc;
      --success: #246b3e;
      --success-soft: #e2f0d9;
      --paper-blue: #dae8fc;
      --paper-purple: #f2f2f2;
      --radius: 8px;
      --shadow: 8px 8px 0 rgba(23, 23, 23, 0.08);
      --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    }

    html {
      background: #fff;
    }

    body {
      background:
        radial-gradient(circle at 1px 1px, rgba(23, 23, 23, 0.085) 1px, transparent 0) 0 0 / 18px 18px,
        #fff;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(168, 91, 0, 0.28);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(1480px, calc(100vw - 28px));
      min-height: calc(100dvh - 28px);
      margin: 14px auto;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 76px;
      gap: 22px;
      padding: 12px 18px;
      border-bottom: 2px solid var(--ink);
      background: var(--surface);
    }

    .brand {
      gap: 13px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border: 2px solid var(--ink);
      border-radius: 7px 5px 8px 4px;
      background: var(--paper-purple);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      letter-spacing: 0;
    }

    .brand-mark::after {
      width: 7px;
      height: 7px;
      right: 5px;
      top: 5px;
      border: 1.5px solid var(--ink);
      background: var(--accent-soft);
      box-shadow: none;
    }

    .brand-copy span {
      margin-bottom: 3px;
      color: var(--accent-deep);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.09em;
    }

    .brand-copy h1 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .top-actions {
      gap: 9px;
    }

    .demo-tag,
    .status-pill {
      min-height: 32px;
      border: 1.5px solid var(--ink);
      background: var(--paper-purple);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 650;
      border-radius: 5px;
    }

    .demo-tag i,
    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      box-shadow: none;
      border: 1px solid var(--ink);
    }

    .button {
      min-height: 36px;
      gap: 8px;
      padding: 0 13px;
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      background: #fff;
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 12px;
      font-weight: 700;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .button:hover {
      border-color: var(--ink);
      background: var(--accent-faint);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .button.primary {
      border-color: var(--ink);
      background: var(--accent-soft);
      color: var(--ink);
    }

    .button.primary:hover {
      border-color: var(--ink);
      background: #ffe8a3;
    }

    .button:disabled {
      box-shadow: none;
      opacity: 0.4;
    }

    .button.icon-only {
      width: 36px;
    }

    .process-map {
      display: grid;
      grid-template-columns: 152px minmax(0, 1fr) 92px;
      align-items: stretch;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 2px solid var(--ink);
      background:
        linear-gradient(rgba(23, 23, 23, 0.05) 1px, transparent 1px),
        #fff;
      background-size: 100% 14px;
    }

    .map-caption,
    .map-status {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .map-caption span,
    .map-status span {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 650;
      letter-spacing: 0.07em;
    }

    .map-caption strong {
      margin-top: 3px;
      font-family: var(--serif);
      font-size: 14px;
    }

    .map-status {
      align-items: flex-end;
      padding-left: 12px;
      border-left: 1.5px solid var(--line-strong);
      text-align: right;
    }

    .map-status strong {
      margin-bottom: 3px;
      color: var(--accent-deep);
      font-family: var(--mono);
      font-size: 11px;
    }

    .stepper {
      flex-direction: row;
      align-items: stretch;
      gap: 23px;
      padding: 0;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .step-button {
      --node-color: #fff;
      position: relative;
      width: auto;
      min-width: 0;
      min-height: 54px;
      flex: 1 0 118px;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 7px;
      padding: 6px 8px;
      border: 1.5px solid var(--ink);
      border-radius: 6px 8px 6px 7px;
      background: var(--node-color);
      color: var(--ink);
      box-shadow: 2px 2px 0 rgba(32, 37, 42, 0.2);
    }

    .step-button.done { --node-color: var(--paper-purple); }
    .step-button.active { --node-color: var(--accent-soft); }

    .step-button:not(:last-child)::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -19px;
      width: 14px;
      border-top: 2px solid var(--ink);
    }

    .step-button:not(:last-child)::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: calc(50% - 3.5px);
      right: -20px;
      border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent;
      border-left: 5px solid var(--ink);
    }

    .step-button:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--node-color), white 8%);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(32, 37, 42, 0.24);
    }

    .step-button.active {
      background: var(--node-color);
      box-shadow: 4px 4px 0 var(--ink);
      transform: translate(-2px, -2px);
    }

    .step-button.active::marker {
      display: none;
    }

    .step-number {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      font-size: 9px;
      font-weight: 750;
    }

    .step-button.active .step-number,
    .step-button.done .step-number {
      background: var(--ink);
      color: #fff;
    }

    .step-label {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .step-indicator {
      display: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 342px;
      min-height: calc(100dvh - 200px);
    }

    .workspace {
      background: var(--surface);
    }

    .scenario-bar {
      min-height: 62px;
      padding: 10px 22px;
      border-bottom: 1.5px solid var(--ink);
      background:
        linear-gradient(90deg, rgba(242, 242, 242, 0.72), rgba(255, 255, 255, 0.4)),
        var(--surface);
    }

    .scenario-copy span {
      margin-bottom: 2px;
      color: var(--accent-deep);
      font-size: 8px;
      font-weight: 700;
    }

    .scenario-copy h2 {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 750;
    }

    .scenario-mode {
      min-height: 29px;
      padding: 0 9px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font-size: 8px;
      font-weight: 700;
    }

    .stage {
      min-height: 600px;
      padding: 22px 26px 20px;
      background:
        linear-gradient(90deg, rgba(23, 23, 23, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 23, 23, 0.035) 1px, transparent 1px),
        var(--surface);
      background-size: 24px 24px;
    }

    .stage-inner {
      max-width: 960px;
    }

    .figure-stage {
      --step-accent: var(--accent-deep);
      --step-wash: var(--accent-soft);
      min-width: 0;
      animation: stage-in 220ms ease both;
    }

    .figure-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      color: var(--faint);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .figure-meta span:first-child {
      padding: 3px 6px;
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      background: var(--ink);
      color: #fff;
      font-weight: 750;
    }

    .figure-meta span:nth-child(2) {
      color: var(--ink);
      font-weight: 700;
    }

    .figure-meta span:last-child {
      margin-left: auto;
    }

    .stage-head {
      position: relative;
      min-height: 64px;
      margin-bottom: 18px;
      padding: 0 0 14px 66px;
      border-bottom: 1.5px solid var(--ink);
    }

    .stage-head::before {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 6px 5px 8px 5px;
      background: var(--step-wash);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 800;
    }

    .figure-stage.step-1 .stage-head::before { content: "01"; }
    .figure-stage.step-2 .stage-head::before { content: "02"; }
    .figure-stage.step-3 .stage-head::before { content: "03"; }
    .figure-stage.step-4 .stage-head::before { content: "04"; }
    .figure-stage.step-5 .stage-head::before { content: "05"; }
    .figure-stage.step-6 .stage-head::before { content: "06"; }
    .figure-stage.step-7 .stage-head::before { content: "07"; }

    .stage-kicker {
      display: inline-block;
      margin-bottom: 5px;
      padding: 2px 5px;
      background: color-mix(in srgb, var(--step-wash), transparent 16%);
      color: var(--step-accent);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stage-head h3 {
      margin-bottom: 6px;
      font-family: var(--serif);
      font-size: clamp(23px, 2vw, 29px);
      font-weight: 750;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .stage-head p {
      max-width: 70ch;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .stage-split,
    .gate-layout,
    .context-layout,
    .control-surface {
      gap: 16px;
    }

    .section-surface,
    .gate-flow,
    .score-panel,
    .context-window,
    .token-box,
    .rule-note,
    .chat-stage,
    .control-block {
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.1);
    }

    .section-surface {
      padding: 16px;
    }

    .step-1 .stage-split .section-surface:first-child {
      background: var(--paper-purple);
    }

    .step-1 .stage-split .section-surface:last-child {
      background: var(--accent-faint);
    }

    .step-1 .stage-split {
      position: relative;
    }

    .step-1 .stage-split::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 50%;
      left: calc(60% - 8px);
      width: 18px;
      border-top: 2px solid var(--ink);
    }

    .step-1 .stage-split::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: calc(50% - 4px);
      left: calc(60% + 8px);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid var(--ink);
    }

    .section-label {
      margin-bottom: 12px;
      padding-bottom: 7px;
      border-bottom: 1px dashed rgba(32, 37, 42, 0.35);
      color: var(--ink);
      font-size: 8px;
    }

    .section-label strong {
      color: var(--ink);
    }

    .avatar {
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      background: var(--paper-purple);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .message-bubble {
      border: 1.5px solid var(--ink);
      border-radius: 4px 8px 8px 8px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .message-meta {
      color: var(--muted);
    }

    .signal-row {
      border-bottom: 1px dashed rgba(32, 37, 42, 0.24);
    }

    .signal-row > span {
      color: var(--ink);
      font-weight: 700;
    }

    .chip {
      min-height: 25px;
      border: 1.25px solid var(--ink);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--ink);
      font-size: 10px;
    }

    .chip.accent {
      border-color: var(--ink);
      background: var(--paper-blue);
      color: var(--ink);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .decision-hint {
      margin-top: 14px;
      padding: 10px;
      border: 1.5px dashed var(--ink);
      border-radius: 5px;
      background: var(--accent-faint);
      color: var(--ink);
      font-weight: 600;
    }

    .decision-hint .live-dot {
      margin-top: 3px;
      background: var(--accent);
    }

    .gate-layout {
      grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.55fr);
    }

    .gate-flow {
      padding: 16px;
      background: #fff;
    }

    .flow-row {
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 15px;
      min-height: 84px;
    }

    .flow-row:not(:last-child)::after {
      left: 49px;
      top: 56px;
      width: 0;
      height: 34px;
      border-left: 2px solid var(--ink);
      background: transparent;
    }

    .flow-row:not(:last-child) .flow-tag::after {
      content: "";
      position: absolute;
      left: 41px;
      bottom: -38px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--ink);
    }

    .flow-tag {
      width: 92px;
      min-height: 50px;
      border: 1.5px solid var(--ink);
      border-radius: 6px 4px 7px 5px;
      background: var(--paper-blue);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 8px;
      font-weight: 750;
    }

    .flow-tag.accent {
      border-color: var(--ink);
      background: var(--accent-soft);
      color: var(--ink);
    }

    .flow-tag.success {
      border-color: var(--ink);
      background: var(--success-soft);
      color: var(--ink);
    }

    .flow-copy strong {
      font-family: var(--serif);
      font-size: 14px;
    }

    .flow-copy span {
      color: var(--muted);
    }

    .score-panel {
      background: var(--paper-purple);
    }

    .score-dial {
      width: 126px;
      height: 126px;
      border: 2px solid var(--ink);
      background:
        radial-gradient(circle at center, #fff 57%, transparent 58%),
        conic-gradient(var(--ink) calc(var(--score) * 1%), #fff 0);
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.12);
    }

    .score-dial::after {
      width: 96px;
      height: 96px;
      border: 1.5px solid var(--ink);
      background: #fff;
    }

    .score-value strong {
      font-size: 27px;
      letter-spacing: -0.04em;
    }

    .score-value span {
      color: var(--ink);
    }

    .metric-line {
      border-top: 1px dashed rgba(32, 37, 42, 0.36);
      color: var(--ink);
    }

    .recall-summary {
      gap: 0;
      margin-bottom: 14px;
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      background: var(--ink);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.1);
    }

    .summary-cell {
      padding: 11px 13px;
      border-right: 1.5px solid var(--ink);
      background: #fff;
    }

    .summary-cell:last-child { border-right: 0; }

    .summary-cell span {
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 650;
    }

    .summary-cell strong {
      font-family: var(--serif);
      font-size: 14px;
    }

    .memory-stack {
      gap: 10px;
    }

    .memory-row {
      grid-template-columns: 33px minmax(0, 1fr) 62px;
      gap: 11px;
      padding: 12px;
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      background: #fff;
      box-shadow: 2px 2px 0 rgba(23, 23, 23, 0.1);
    }

    .memory-row:nth-child(2),
    .memory-row:nth-child(3) { background: #fff; }
    .memory-row:nth-child(4) { background: var(--paper-purple); }

    .memory-row:hover {
      border-color: var(--ink);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.16);
    }

    .memory-row.selected {
      border-color: var(--ink);
      background: var(--accent-faint);
      box-shadow: inset 4px 0 0 var(--accent), 3px 3px 0 rgba(23, 23, 23, 0.14);
    }

    .memory-row:nth-child(1).selected,
    .memory-row:nth-child(2).selected,
    .memory-row:nth-child(3).selected { background: var(--accent-faint); }

    .memory-check {
      width: 23px;
      height: 23px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.72);
      color: transparent;
    }

    .memory-row.selected .memory-check {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .layer-tag {
      padding: 2px 5px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.65);
      color: var(--ink);
      font-weight: 700;
    }

    .memory-meta {
      color: var(--muted);
    }

    .memory-text {
      font-size: 12px;
    }

    .memory-score {
      color: var(--muted);
    }

    .blocked-row {
      margin-top: 12px;
      border: 1.5px dashed var(--danger);
      border-radius: 6px;
      background: var(--danger-soft);
      color: #7a271a;
    }

    .blocked-row strong {
      color: var(--danger);
    }

    .context-layout {
      grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.55fr);
    }

    .context-window {
      background: #fff;
    }

    .context-row {
      grid-template-columns: 94px minmax(0, 1fr);
      border-bottom: 1px dashed rgba(32, 37, 42, 0.28);
      background: #fff;
    }

    .context-row:nth-child(1) { background: var(--paper-purple); }
    .context-row:nth-child(2),
    .context-row:nth-child(3),
    .context-row:nth-child(4),
    .context-row:nth-child(5) { background: #fff; }

    .context-key {
      color: var(--ink);
      font-weight: 750;
    }

    .context-memory {
      border-top: 1px dashed rgba(32, 37, 42, 0.34);
    }

    .context-memory b {
      color: var(--ink);
    }

    .context-side {
      gap: 13px;
    }

    .token-box {
      background: var(--paper-purple);
    }

    .token-box span {
      color: var(--ink);
    }

    .token-box strong {
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .token-bar {
      height: 10px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: #fff;
    }

    .token-bar .system-token { background: #c8c8c2; }
    .token-bar .query-token { background: var(--paper-blue); }
    .token-bar .memory-token { background: var(--accent-soft); }

    .token-legend {
      color: var(--ink);
    }

    .rule-note {
      background: var(--accent-faint);
      color: var(--ink);
    }

    .rule-note strong {
      font-family: var(--serif);
    }

    .chat-stage {
      overflow: hidden;
      background: #fff;
    }

    .chat-stage-head {
      padding: 10px 14px;
      border-bottom: 1.5px solid var(--ink);
      background: var(--paper-purple);
      color: var(--ink);
      font-weight: 700;
    }

    .chat-body {
      background:
        linear-gradient(rgba(32, 37, 42, 0.025) 1px, transparent 1px),
        #fff;
      background-size: 100% 28px;
    }

    .assistant-avatar {
      border: 1.5px solid var(--ink);
      background: var(--accent-soft);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .assistant-content > p {
      padding: 10px 12px;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: #fff;

    .schedule {

      border-radius: 6px;
      background: #fff;
      overflow: hidden;
    }

    .schedule-row {

      border-bottom: 1px dashed rgba(32, 37, 42, 0.32);
    }

    .schedule-row { background: #fff; }
    .schedule-row:last-child { border-bottom: 0; }

    .schedule-row time {
      color: var(--ink);
      font-weight: 750;
    }

    .memory-state-banner {
      border: 1.25px dashed var(--ink);
      border-radius: 4px;
      background: var(--success-soft);
      color: var(--ink);

      background: var(--danger-soft);

      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--ink);
      font-weight: 700;

      border-color: var(--ink);
      background: #ffe8a3;

    .impact-strip {
      gap: 0;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: var(--ink);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.1);

    .impact-strip div {
      border-right: 1.5px solid var(--ink);
      background: #fff;
      color: var(--ink);

    .impact-strip div:nth-child(1) { background: var(--accent-faint); }

    .impact-strip div:nth-child(3) { border-right: 0; background: var(--paper-purple); }

      font-family: var(--serif);

    .followup-row {
      margin-bottom: 15px;

      border-radius: 5px;
      background: #fff;
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.1);

      background: #fff;

    .extract-list {
      gap: 9px;

    .extract-row {

      border-radius: 6px;
      background: #fff;
      box-shadow: 2px 2px 0 rgba(23, 23, 23, 0.1);

    .extract-row.blocked {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

      border: 1px solid var(--ink);
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
    }

    .extract-row.blocked .extract-type {
      border-color: var(--danger);
      background: #fff;
      color: var(--danger);
    }

    .extract-copy strong {
      font-size: 11.5px;
    }

    .confidence-bar {
      height: 5px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: #fff;
    }

    .confidence-bar i {
      background: var(--ink);
    }

    .extract-row.blocked .confidence-bar {
      border-color: var(--danger);
    }

    .extract-row.blocked .confidence-bar i {
      background: var(--danger);
    }

    .layer-grid {
      gap: 0;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: var(--ink);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.1);
    }

    .layer-cell {
      border-right: 1.5px solid var(--ink);
      background: #fff;
    }

    .layer-cell:nth-child(3) { border-right: 0; }

    .layer-cell span {
      color: var(--ink);
      font-weight: 700;
    }

    .layer-cell strong {
      font-family: var(--serif);
      font-size: 14px;
    }

    .layer-cell p {
      color: var(--muted);
    }

    .lifecycle-list {
      gap: 10px;

    .lifecycle-row {
      grid-template-columns: 72px minmax(0, 1fr) 96px;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: #fff;
      box-shadow: 2px 2px 0 rgba(23, 23, 23, 0.1);

    .lifecycle-row:nth-child(3) { background: #fff; }

    .lifecycle-row.blocked {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .lifecycle-action {
      padding: 4px 5px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--ink);
      font-weight: 750;
      text-align: center;

    .control-surface {
      grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr);
    }

    .control-block:first-child {
      background: #fff;
    }

    .control-block:last-child {
      background: var(--paper-purple);
    }

    .switch {
      width: 42px;
      height: 24px;
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      background: #fff;
    }

    .switch::after {
      width: 17px;
      height: 17px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: #fff;
      box-shadow: none;
    }

    .switch.on {
      background: var(--ink);
    }

    .switch.on::after {
      background: var(--success-soft);
      transform: translateX(17px);
    }

    .text-button {
      min-height: 32px;
      border: 1.5px solid var(--danger);
      border-radius: 4px;
      background: #fff;
      color: var(--danger);
      font-weight: 700;
      box-shadow: 2px 2px 0 var(--danger);
    }

    .text-button:hover {
      background: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--danger);
    }

    .empty-state {
      border: 1.5px dashed var(--ink);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.52);
      color: var(--ink);
    }

    .figure-caption {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 19px;
      padding-top: 10px;

      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .figure-caption b {
      flex: 0 0 auto;
      padding: 2px 6px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: var(--step-wash);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 8px;
    }

    .stage-footer {
      grid-template-columns: 110px minmax(80px, 1fr) 112px;
      gap: 14px;
      padding: 12px 22px;
      border-top: 1.5px solid var(--ink);
      background: #fff;
    }

    .footer-progress {
      height: 9px;
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      background: #fff;
    }

    .footer-progress span {
      border-right: 1.5px solid var(--ink);
      border-radius: 0;
      background: var(--accent);
    }

    .explain {
      border-left: 2px solid var(--ink);
      background: #fff;
    }

    .explain-head {
      padding: 15px 15px 11px;
      border-bottom: 1.5px solid var(--ink);
      background: var(--paper-purple);
    }

    .explain-head span {
      color: var(--ink);
      font-size: 8px;
      font-weight: 800;
    }

    .explain-head span:last-child {
      color: var(--ink);
      font-weight: 650;
    }

    .explain-content {
      padding: 17px 15px;
      background:
        linear-gradient(rgba(23, 23, 23, 0.045) 1px, transparent 1px),
        #fff;
      background-size: 100% 25px;
    }

    .explain-content h4 {
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .explain-content > p {
      color: #394046;
      font-size: 11px;
      line-height: 1.75;
    }

    .explain-points {
      gap: 10px;
    }

    .explain-points li {
      gap: 9px;
      color: #394046;
      font-size: 10px;
    }

    .explain-points li::before {
      content: "";
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      margin-top: 3px;
      border: 1.25px solid var(--ink);
      border-radius: 2px;
      background: var(--paper-purple);
    }

    .explain-points li:nth-child(2)::before,
    .explain-points li:nth-child(3)::before { background: var(--paper-purple); }

    .explain-callout {
      margin-top: 17px;
      padding: 11px;
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      background: var(--accent-faint);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      font-family: var(--serif);
      font-size: 11px;
      line-height: 1.65;
    }

    .explain-callout span {
      color: var(--ink);
      font-family: var(--mono);
    }

    .system-status {
      border-top: 1.5px solid var(--ink);
      background: #fff;
    }

    .status-head {
      padding: 10px 15px;
      background: var(--paper-purple);
      color: var(--ink);
      font-weight: 750;
    }

    .status-row {
      padding: 8px 15px;
      border-top: 1px dashed rgba(32, 37, 42, 0.3);
      color: var(--muted);
    }

    .status-row strong {
      padding: 2px 4px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      background: var(--surface-strong);
      color: var(--ink);
    }

    .status-row strong.on {
      border-color: var(--success);
      background: var(--success-soft);
      color: var(--success);
    }

    .toast {
      bottom: 22px;
      padding: 11px 14px;
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      background: var(--ink);
      color: #fff;
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.18);
    }

          ? "该偏好已被用户主动遗忘，不再参与召回。"

          <button class="memory-row ${isSelected ? "selected" : ""} ${id === "m4" ? "low-score" : ""} ${isForgotten ? "forgotten" : ""} ${isSuspended ? "suspended" : ""}" type="button" data-memory="${id}" aria-pressed="${isSelected}" ${id === "m4" || isForgotten || isSuspended ? "disabled" : ""}>

        <ul class="explain-points">
          ${item.points.map((point) => `<li>${point}</li>`).join("")}
        </ul>
        <div class="explain-callout">
          <span>PRODUCT NOTE</span>
          ${item.callout}
        </div>
      `;
      renderSystemStatus();
    }

    function renderSystemStatus() {
      const selectedCount = includedIds().length;
      systemStatus.innerHTML = `
        <div class="status-head">SYSTEM STATUS</div>
        <div class="status-row"><span>隐私过滤</span><strong class="on">ACTIVE</strong></div>
        <div class="status-row"><span>长期记忆</span><strong class="${state.longTermEnabled ? "on" : ""}">${state.longTermEnabled ? "ON" : "OFF"}</strong></div>
        <div class="status-row"><span>本次入选</span><strong>${selectedCount} MEMORIES</strong></div>
        <div class="status-row"><span>运行模式</span><strong>LOCAL SIM</strong></div>
      `;
    }

    function updateChrome() {
      const item = steps[state.step];
      stepCounter.textContent = `${String(state.step + 1).padStart(2, "0")} / ${String(steps.length).padStart(2, "0")}`;
      footerProgress.style.width = `${((state.step + 1) / steps.length) * 100}%`;
      backButton.disabled = state.step === 0;
      nextLabel.textContent = state.step === steps.length - 1 ? "重新体验" : "下一步";
      const nextUse = nextButton.querySelector("use");
      if (state.step === steps.length - 1) {
        nextUse.setAttribute("href", "#icon-rotate");
      } else {
        nextUse.setAttribute("href", "#icon-arrow-right");
      }
      autoButton.title = state.autoTimer ? "暂停自动演示" : "自动演示";
      autoButton.querySelector("use").setAttribute("href", state.autoTimer ? "#icon-pause" : "#icon-play");
      autoButton.querySelector(".button-label").textContent = state.autoTimer ? "暂停演示" : "自动演示";
      document.title = `${item.short} · 个人记忆系统演示`;
      renderStepper();
      requestAnimationFrame(() => {
        const activeStep = stepper.querySelector(`[data-step="${state.step}"]`);
        if (!activeStep || stepper.scrollWidth <= stepper.clientWidth) return;
        const stepperRect = stepper.getBoundingClientRect();
        const activeRect = activeStep.getBoundingClientRect();
        const centeredLeft = stepper.scrollLeft + activeRect.left - stepperRect.left
          - (stepper.clientWidth - activeRect.width) / 2;
        const maxLeft = stepper.scrollWidth - stepper.clientWidth;
        stepper.scrollTo({
          left: Math.max(0, Math.min(centeredLeft, maxLeft)),
          behavior: "smooth"
        });
      });
      renderSystemStatus();
    }

    function bindStageEvents() {
      stage.querySelectorAll("[data-memory]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.memory;
          if (id === "m4") return;
          state.included[id] = !state.included[id];
          renderStage();
          updateChrome();
        });
      });

      const answerToggle = document.getElementById("answerMemoryToggle");
      if (answerToggle) {
        answerToggle.addEventListener("click", () => {
          state.memoryEnabled = !state.memoryEnabled;
          renderStage();
          updateChrome();
          renderSystemStatus();
        });
      }

      stage.querySelectorAll("[data-ref]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = memoryItems[button.dataset.ref];
          showToast(`${item.id} · ${item.layer}：${item.text}`);
        });
      });

      const longTermToggle = document.getElementById("longTermToggle");
      if (longTermToggle) {
        longTermToggle.addEventListener("click", () => {
          state.longTermEnabled = !state.longTermEnabled;
          renderStage();
          renderSystemStatus();
          showToast(state.longTermEnabled ? "长期记忆已开启。" : "长期记忆已关闭，后续对话只保留会话内上下文。");
        });
      }

      const forgetMemory = document.getElementById("forgetMemory");
      if (forgetMemory) {
        forgetMemory.addEventListener("click", () => {
          state.forgotten = true;
          renderStage();
          renderSystemStatus();
          showToast("M1 已从画像记忆删除，后续召回将立即停止使用。");
        });
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function goToStep(index, options = {}) {
      const nextIndex = Math.max(0, Math.min(index, steps.length - 1));
      state.step = nextIndex;
      if (options.manual) stopAuto();
      renderStage();
      renderExplain();
      updateChrome();
    }

    function stopAuto() {
      if (state.autoTimer) {
        window.clearInterval(state.autoTimer);
        state.autoTimer = null;
      }
      updateChrome();
    }

    function toggleAuto() {
      if (state.autoTimer) {
        stopAuto();
        return;
      }
      if (state.step === steps.length - 1) {
        resetDemo();
      }
      state.autoTimer = window.setInterval(() => {
        if (state.step >= steps.length - 1) {
          stopAuto();
          return;
        }
        goToStep(state.step + 1);
      }, 2400);
      updateChrome();
    }

    function resetDemo() {
      stopAuto();
      state.step = 0;
      state.included = { m1: true, m2: true, m3: true };
      state.memoryEnabled = true;
      state.longTermEnabled = true;
      state.forgotten = false;
      renderStage();
      renderExplain();
      updateChrome();
    }

    stepper.addEventListener("click", (event) => {
      const button = event.target.closest("[data-step]");
      if (!button) return;
      goToStep(Number(button.dataset.step), { manual: true });
    });

    backButton.addEventListener("click", () => {
      goToStep(state.step - 1, { manual: true });
    });

    nextButton.addEventListener("click", () => {
      if (state.step === steps.length - 1) {
        resetDemo();
        return;
      }
      goToStep(state.step + 1, { manual: true });
    });

    autoButton.addEventListener("click", toggleAuto);
    resetButton.addEventListener("click", () => {
      resetDemo();
      showToast("测试数据已恢复到初始状态。");
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, button")) return;
      if (event.key === "ArrowRight") goToStep(state.step + 1, { manual: true });
      if (event.key === "ArrowLeft") goToStep(state.step - 1, { manual: true });
    });

    renderStage();
    renderExplain();
    updateChrome();
  </script>
</body>
</html>
